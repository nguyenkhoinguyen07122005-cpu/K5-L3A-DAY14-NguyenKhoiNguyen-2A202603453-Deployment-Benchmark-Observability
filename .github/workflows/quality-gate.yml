# Exercise 7.3 — chặn merge nếu eval accuracy < 85% hoặc có regression so với baseline
name: quality-gate
on:
  push:
    paths: ["06-lab-complete/benchmark-observability/**"]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Eval + quality gate (exit 1 → job fail → PR không merge được)
        run: |
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 \
            --baseline reports/eval_v2.json --out eval_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/eval_ci.json
