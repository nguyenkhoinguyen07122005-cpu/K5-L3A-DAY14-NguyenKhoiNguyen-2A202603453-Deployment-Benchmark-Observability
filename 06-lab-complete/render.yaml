# Render Blueprint — New → Blueprint → chọn repo, Blueprint file path: 06-lab-complete/render.yaml
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    dockerfilePath: ./06-lab-complete/Dockerfile   # đường dẫn tính từ gốc repo (bản fork)
    dockerContext: ./06-lab-complete
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi thẳng giá trị
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: redis
    name: agent-redis
    plan: free
    ipAllowList: []                  # chỉ cho phép kết nối nội bộ từ service trên Render
    maxmemoryPolicy: allkeys-lru
