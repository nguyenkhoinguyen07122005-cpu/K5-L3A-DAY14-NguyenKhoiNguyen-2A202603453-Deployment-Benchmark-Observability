# Render Blueprint — Dashboard → New → Blueprint → chọn repo
#   Blueprint Path: 06-lab-complete/render.yaml   (file không nằm ở gốc repo)
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete          # code Part 6 nằm trong thư mục con của bản fork
    dockerfilePath: ./Dockerfile      # tính từ rootDir
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi thẳng giá trị
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue                   # Render Key Value (Redis-compatible; "redis" là tên cũ)
    name: agent-redis
    plan: free
    ipAllowList: []                  # chặn kết nối từ internet, chỉ dùng mạng nội bộ của Render
    maxmemoryPolicy: allkeys-lru
