# Railway — build bằng Dockerfile, healthcheck /health
# Railway tự cấp biến PORT; CMD trong Dockerfile dùng ${PORT:-8000}.
# Secrets (AGENT_API_KEY, REDIS_URL...) đặt bằng `railway variables set` hoặc dashboard — không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
